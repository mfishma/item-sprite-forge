name: Deploy to Hataw
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to hataw.dev
        id: hataw_deploy
        run: node scripts/hataw/deploy.js
        
      - name: Output deployment details
        run: |
          echo "Site URL: ${{ steps.hataw_deploy.outputs.site_url }}"
          echo "Claim URL: ${{ steps.hataw_deploy.outputs.claim_url }}"
          
      - name: Add Pull Request comment with Claim URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deployed to Hataw!\n\n**Live URL:** ${'${{ steps.hataw_deploy.outputs.site_url }}'}\n**Claim URL:** ${'${{ steps.hataw_deploy.outputs.claim_url }}'}\n*(Use the Claim URL to attach this deployment to your Hataw account)*`
            })
